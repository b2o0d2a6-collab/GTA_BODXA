<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTA BODXA: San Andreas 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    /* واجهة اللعبة (HUD) */
    #ui {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #fff;
      text-align: right;
      z-index: 10;
      pointer-events: none;
    }
    h1 {
      font-size: 1.8rem;
      color: #eab308;
      text-shadow: 2px 2px 4px #000;
    }
    .hud-status {
      font-size: 1rem;
      color: #22c55e;
      font-weight: bold;
      margin-top: 5px;
    }

    /* تعليمات التحكم */
    .controls-hint {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 0.85rem;
      border: 1px solid #eab308;
      z-index: 10;
      line-height: 1.6;
    }

    /* هاتف BODXA المحمول (زر T) */
    #phone {
      position: absolute;
      bottom: -400px; /* مخفي أسفل الشاشة */
      left: 30px;
      width: 200px;
      height: 380px;
      background: #0f172a;
      border: 4px solid #38bdf8;
      border-radius: 30px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
      transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      color: white;
    }
    #phone.active {
      bottom: 20px; /* يظهر عند الضغط على T */
    }
    .phone-notch {
      width: 60px;
      height: 8px;
      background: #334155;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    .phone-screen {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1e1b4b, #311042);
      border-radius: 18px;
      padding: 15px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .phone-time {
      font-size: 1.5rem;
      font-weight: bold;
      color: #38bdf8;
    }
    .phone-app {
      background: rgba(255, 255, 255, 0.1);
      padding: 10px;
      border-radius: 10px;
      font-size: 0.8rem;
      margin-top: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
  <!-- مكتبة Three.js للرسوم ثلاثية الأبعاد -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui">
    <h1>🌴 GTA BODXA: SAN ANDREAS</h1>
    <div class="hud-status" id="playerStatus">الشخصية: بودا (BOUDA)</div>
  </div>

  <div class="controls-hint">
    🎮 <b>التحكم:</b> الأسهم / WASD للمشي والقيادة<br>
    🚗 <b>زر E:</b> ركوب / الخروج من السيارة<br>
    📱 <b>زر T:</b> فتح / إغلاق الهاتف الذكي
  </div>

  <!-- الهاتف المحمول -->
  <div id="phone">
    <div class="phone-notch"></div>
    <div class="phone-screen">
      <div>
        <div class="phone-time" id="phoneTime">12:00</div>
        <p style="font-size: 0.7rem; color: #94a3b8;">BODXA OS v1.0</p>
      </div>
      <div>
        <div class="phone-app">📱 الخريطة</div>
        <div class="phone-app">🚗 طلب سيارة</div>
        <div class="phone-app">⚙️ الإعدادات</div>
      </div>
      <p style="font-size: 0.65rem; color: #cbd5e1;">اضغط T لإغلاق الهاتف</p>
    </div>
  </div>

  <script>
    // 1. إعداد المشهد ثلاثي الأبعاد
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x38bdf8); // سماء سان أندرياس الصافية
    scene.fog = new THREE.Fog(0x38bdf8, 30, 180);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 2. الإضاءة
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfffbeb, 0.9);
    sunLight.position.set(50, 100, 50);
    sunLight.castShadow = true;
    scene.add(sunLight);

    // 3. الأرضية والشارع (الأسفلت)
    const floorGeo = new THREE.PlaneGeometry(400, 400);
    const floorMat = new THREE.MeshPhongMaterial({ color: 0x1e293b });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // 4. بناء شخصية "بودا" (Bouda Character)
    const playerGroup = new THREE.Group();

    // جسم بودا
    const bodyGeo = new THREE.CylinderGeometry(0.5, 0.4, 1.5, 12);
    const bodyMat = new THREE.MeshPhongMaterial({ color: 0xeab308 }); // قميص أصفر سان أندرياس
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 1.25;
    playerGroup.add(body);

    // رأس بودا
    const headGeo = new THREE.SphereGeometry(0.4, 16, 16);
    const headMat = new THREE.MeshPhongMaterial({ color: 0xfdba74 }); // لون البشرة
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 2.3;
    playerGroup.add(head);

    // أرجُل بودا
    const legGeo = new THREE.CylinderGeometry(0.18, 0.15, 1, 8);
    const legMat = new THREE.MeshPhongMaterial({ color: 0x1e3a8a }); // بنطال جينز أزرق
    const leg1 = new THREE.Mesh(legGeo, legMat); leg1.position.set(-0.25, 0.5, 0);
    const leg2 = new THREE.Mesh(legGeo, legMat); leg2.position.set(0.25, 0.5, 0);
    playerGroup.add(leg1); playerGroup.add(leg2);

    scene.add(playerGroup);
    playerGroup.position.set(0, 0, 0);

    // 5. إنشاء سيارات ثلاثية الأبعاد
    function createCar(x, z, color) {
      const car = new THREE.Group();
      
      // جسم السيارة السفلي
      const bodyG = new THREE.BoxGeometry(2.4, 0.9, 4.5);
      const bodyM = new THREE.MeshPhongMaterial({ color: color });
      const carB = new THREE.Mesh(bodyG, bodyM);
      carB.position.y = 0.7;
      car.add(carB);

      // كابينة السيارة الزجاجية
      const topG = new THREE.BoxGeometry(2, 0.7, 2.2);
      const topM = new THREE.MeshPhongMaterial({ color: 0x0284c7 });
      const carT = new THREE.Mesh(topG, topM);
      carT.position.set(0, 1.4, -0.2);
      car.add(carT);

      // الإطارات
      const wheelG = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 12);
      const wheelM = new THREE.MeshPhongMaterial({ color: 0x000000 });
      wheelG.rotateZ(Math.PI / 2);

      const w1 = new THREE.Mesh(wheelG, wheelM); w1.position.set(1.2, 0.4, 1.3);
      const w2 = new THREE.Mesh(wheelG, wheelM); w2.position.set(-1.2, 0.4, 1.3);
      const w3 = new THREE.Mesh(wheelG, wheelM); w3.position.set(1.2, 0.4, -1.3);
      const w4 = new THREE.Mesh(wheelG, wheelM); w4.position.set(-1.2, 0.4, -1.3);
      car.add(w1); car.add(w2); car.add(w3); car.add(w4);

      car.position.set(x, 0, z);
      scene.add(car);
      return car;
    }

    const carsList = [
      createCar(8, 10, 0xef4444), // سيارة حمراء
      createCar(-12, -15, 0x2563eb)  // سيارة زرقاء
    ];

    // 6. المباني ثلاثية الأبعاد بتفاصيل قريبة لسان أندرياس
    const buildingColors = [0xd4d4d8, 0xca8a04, 0xb91c1c, 0x475569];
    for (let i = 0; i < 35; i++) {
      const h = Math.random() * 20 + 10;
      const bG = new THREE.BoxGeometry(12, h, 12);
      const bM = new THREE.MeshPhongMaterial({ color: buildingColors[i % buildingColors.length] });
      const building = new THREE.Mesh(bG, bM);

      let x = (Math.random() - 0.5) * 280;
      let z = (Math.random() - 0.5) * 280;
      if (Math.abs(x) < 20) x += 30;
      if (Math.abs(z) < 20) z += 30;

      building.position.set(x, h / 2, z);
      scene.add(building);
    }

    // 7. المنطق والتحكم بـ "بودا" والسيارات والتليفون
    let inCar = false;
    let activeCar = null;
    let isPhoneOpen = false;
    let speed = 0, angle = 0;
    const keys = {};

    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      keys[k] = true;

      // زر T: فتح وإغلاق التليفون
      if (k === 't') {
        isPhoneOpen = !isPhoneOpen;
        const phone = document.getElementById('phone');
        if (isPhoneOpen) {
          phone.classList.add('active');
          const now = new Date();
          document.getElementById('phoneTime').innerText = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        } else {
          phone.classList.remove('active');
        }
      }

      // زر E: ركوب والنزول من السيارة
      if (k === 'e') {
        if (inCar) {
          // النزول من السيارة
          inCar = false;
          playerGroup.visible = true;
          playerGroup.position.set(activeCar.position.x + 3, 0, activeCar.position.z);
          activeCar = null;
          document.getElementById('playerStatus').innerText = "الشخصية: بودا (ترجل من السيارة)";
        } else {
          // البحث عن أقرب سيارة لركوبها
          carsList.forEach(car => {
            const dist = playerGroup.position.distanceTo(car.position);
            if (dist < 5) {
              inCar = true;
              activeCar = car;
              playerGroup.visible = false;
              document.getElementById('playerStatus').innerText = "الشخصية: بودا (يقود السيارة 🚗)";
            }
          });
        }
      }
    });

    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    // تحديث الحركة والفيزياء
    function updatePhysics() {
      const moveSpeed = inCar ? 0.6 : 0.2;

      let forward = 0, turn = 0;
      if (keys['arrowup'] || keys['w']) forward = moveSpeed;
      if (keys['arrowdown'] || keys['s']) forward = -moveSpeed / 2;
      if (keys['arrowleft'] || keys['a']) turn = 0.04;
      if (keys['arrowright'] || keys['d']) turn = -0.04;

      if (inCar && activeCar) {
        // حركة القيادة بالسيارة
        angle += turn;
        activeCar.rotation.y = angle;
        activeCar.position.x += Math.sin(angle) * forward;
        activeCar.position.z += Math.cos(angle) * forward;

        // كاميرا القيادة
        camera.position.set(
          activeCar.position.x - Math.sin(angle) * 12,
          activeCar.position.y + 6,
          activeCar.position.z - Math.cos(angle) * 12
        );
        camera.lookAt(activeCar.position);
      } else {
        // حركة مشي "بودا"
        angle += turn;
        playerGroup.rotation.y = angle;
        playerGroup.position.x += Math.sin(angle) * forward;
        playerGroup.position.z += Math.cos(angle) * forward;

        // كاميرا تتبع بودا
        camera.position.set(
          playerGroup.position.x - Math.sin(angle) * 8,
          playerGroup.position.y + 4,
          playerGroup.position.z - Math.cos(angle) * 8
        );
        camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.5, playerGroup.position.z);
      }
    }

    // 8. الحلقة الرئيسية للعبة (Game Loop)
    function animate() {
      requestAnimationFrame(animate);
      updatePhysics();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
